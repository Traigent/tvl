# Scenario 11: After a latency breach the requirement must be met again within 24 hours, or the on-call is paged.
tvl:
  module: examples.runtime13.latency_recovers_within_24h
tvl_version: "1.3"
environment:
  snapshot_id: "2026-10-16T00:00:00Z"
evaluation_set:
  dataset: latency_recovers_within_24h_eval
tvars:
  - name: model
    type: enum[str]
    domain: [m_small, m_large]
objectives:
  - name: quality
    direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02

requirements:
  - name: latency_1500
    kind: rate_bound
    unit: trace
    violation: { metric: wall_clock_latency_ms, exceeds: 1500 }
    max_rate: 0.05
  - name: latency_recovers_24h
    kind: recovery_time
    unit: episode
    of: latency_1500_prod
    within_hours: 24
  - name: latency_evidence_live
    kind: evidence_liveness
    unit: window
    of: latency_1500_prod
    max_stale_windows: 4

monitors:
  - name: latency_1500_prod
    requirement: latency_1500
    phase: runtime
    profile: backend_v1
    evidence: { source: backend_trace_metadata, deployment_environment: production }
    window: { tumbling_hours: 6, grace_minutes: 30 }
    decision:
      method: clopper_pearson_exact_v1
      confidence: 0.95
      false_alarm_budget: 0.05
      horizon_days: 30
      min_samples: 200
      max_unresolved_fraction: 0.05
    episode: { closure_windows: 2, closure_max_age_hours: 24 }
  - name: latency_recovers_24h_check
    requirement: latency_recovers_24h
    phase: runtime
    evidence: { source: episodes }
    decision: { method: exact_count_v1 }
  - name: latency_evidence_live_check
    requirement: latency_evidence_live
    phase: runtime
    evidence: { source: windows }
    decision: { method: exact_count_v1 }

responses:
  - name: recovery_alerts
    rules:
      - { id: warn_open, trigger: { monitor: latency_1500_prod, event: episode_opened }, do: notify, severity: warning }
      - { id: page_overdue, trigger: { monitor: latency_recovers_24h_check, event: recovery_overdue }, do: notify, severity: critical }
      - { id: info_recovered, trigger: { monitor: latency_recovers_24h_check, event: recovery_recovered }, do: notify, severity: info }
