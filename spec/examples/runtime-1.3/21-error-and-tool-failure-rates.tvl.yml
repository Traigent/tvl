# Scenario 21: A workflow agent may have an error event on at most 1 % of traces, and a failed tool result on at most 3 % of traces (rate bounds over event patterns).
tvl:
  module: examples.runtime13.error_and_tool_failure_rates
tvl_version: "1.3"
environment:
  snapshot_id: "2026-10-16T00:00:00Z"
evaluation_set:
  dataset: error_and_tool_failure_rates_eval
tvars:
  - name: model
    type: enum[str]
    domain: [m_small, m_large]
objectives:
  - name: quality
    direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02

requirements:
  - name: trace_error_rate
    kind: rate_bound
    unit: trace
    violation: { pattern: absence, a: { event: error } }
    max_rate: 0.01
  - name: tool_failure_rate
    kind: rate_bound
    unit: trace
    violation: { pattern: absence, a: { event: tool_result, status: failed } }
    max_rate: 0.03
  - name: error_rate_flowing
    kind: evidence_liveness
    unit: window
    of: trace_error_rate_prod
    max_stale_windows: 3
  - name: tool_failure_flowing
    kind: evidence_liveness
    unit: window
    of: tool_failure_rate_prod
    max_stale_windows: 3

monitors:
  - name: trace_error_rate_prod
    requirement: trace_error_rate
    phase: runtime
    evidence: { source: customer_side, deployment_environment: production }
    window: { tumbling_hours: 6, grace_minutes: 30 }
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      horizon_days: 30
      min_samples: 300
      max_unresolved_fraction: 0.05
    episode: { closure_windows: 2, closure_max_age_hours: 24 }
  - name: tool_failure_rate_prod
    requirement: tool_failure_rate
    phase: runtime
    evidence: { source: customer_side, deployment_environment: production }
    window: { tumbling_hours: 6, grace_minutes: 30 }
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      horizon_days: 30
      min_samples: 100
      max_unresolved_fraction: 0.05
    episode: { closure_windows: 2, closure_max_age_hours: 24 }
  - name: error_rate_flowing_check
    requirement: error_rate_flowing
    phase: runtime
    evidence: { source: windows }
    decision: { method: exact_count_v1 }
  - name: tool_failure_flowing_check
    requirement: tool_failure_flowing
    phase: runtime
    evidence: { source: windows }
    decision: { method: exact_count_v1 }

responses:
  - name: reliability_alerts
    rules:
      - { id: error_open, trigger: { monitor: trace_error_rate_prod, event: episode_opened }, do: notify, severity: warning }
      - { id: tool_open, trigger: { monitor: tool_failure_rate_prod, event: episode_opened }, do: notify, severity: warning }
