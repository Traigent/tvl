# Scenario 03: A RAG answerer may use more than 8000 tokens on at most 1 % of invocations, checked on a committed 25 % hash sample of invocations.
tvl:
  module: examples.runtime13.rag_token_budget_sampled
tvl_version: "1.3"
environment:
  snapshot_id: "2026-10-16T00:00:00Z"
evaluation_set:
  dataset: rag_token_budget_sampled_eval
tvars:
  - name: model
    type: enum[str]
    domain: [m_small, m_large]
objectives:
  - name: quality
    direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02

requirements:
  - name: invocation_token_cap
    kind: rate_bound
    unit: invocation
    violation: { metric: total_tokens, exceeds: 8000 }
    max_rate: 0.01
  - name: token_evidence_live
    kind: evidence_liveness
    unit: window
    of: invocation_token_cap_prod
    max_stale_windows: 2

monitors:
  - name: invocation_token_cap_prod
    requirement: invocation_token_cap
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: production
      sampling: { mode: hash_bernoulli_committed_v1, rate: 0.25 }
    window: { tumbling_hours: 24, grace_minutes: 120 }
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      horizon_days: 30
      min_samples: 400
      max_unresolved_fraction: 0.10
    episode: { closure_windows: 2, closure_max_age_hours: 72 }
  - name: token_evidence_live_check
    requirement: token_evidence_live
    phase: runtime
    evidence: { source: windows }
    decision: { method: exact_count_v1 }

responses:
  - name: token_alerts
    rules:
      - { id: warn_open, trigger: { monitor: invocation_token_cap_prod, event: episode_opened }, do: notify, severity: warning }
      - { id: next_step, trigger: { monitor: invocation_token_cap_prod, event: episode_opened }, do: open_next_step }
