# Scenario 01: A customer-support bot must answer within 2 s for at least 95 % of production traces (the existing backend latency requirement, minimal backend_v1 form).
tvl:
  module: examples.runtime13.support_latency_slo
tvl_version: "1.3"
environment:
  snapshot_id: "2026-10-16T00:00:00Z"
evaluation_set:
  dataset: support_latency_slo_eval
tvars:
  - name: model
    type: enum[str]
    domain: [m_small, m_large]
objectives:
  - name: quality
    direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02

requirements:
  - name: latency_2s
    kind: rate_bound
    unit: trace
    violation: { metric: wall_clock_latency_ms, exceeds: 2000 }
    max_rate: 0.05
  - name: latency_evidence_live
    kind: evidence_liveness
    unit: window
    of: latency_2s_prod
    max_stale_windows: 4

monitors:
  - name: latency_2s_prod
    requirement: latency_2s
    phase: runtime
    profile: backend_v1
    evidence: { source: backend_trace_metadata }
    decision: { method: clopper_pearson_exact_v1 }
  - name: latency_evidence_live_check
    requirement: latency_evidence_live
    phase: runtime
    evidence: { source: windows }
    decision: { method: exact_count_v1 }
