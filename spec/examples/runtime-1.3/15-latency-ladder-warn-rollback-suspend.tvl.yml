# Scenario 15: On a latency breach, warn at once, roll back to the last certified configuration if still breached after 6 hours, and (with a human's approval) suspend the agent if recovery is overdue after 48 hours.
tvl:
  module: examples.runtime13.latency_ladder_warn_rollback_suspend
tvl_version: "1.3"
environment:
  snapshot_id: "2026-10-16T00:00:00Z"
evaluation_set:
  dataset: latency_ladder_warn_rollback_suspend_eval
tvars:
  - name: model
    type: enum[str]
    domain: [m_small, m_large]
objectives:
  - name: quality
    direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02

requirements:
  - name: latency_2500
    kind: rate_bound
    unit: trace
    violation: { metric: wall_clock_latency_ms, exceeds: 2500 }
    max_rate: 0.05
  - name: latency_back_in_48h
    kind: recovery_time
    unit: episode
    of: latency_2500_prod
    within_hours: 48
  - name: latency_flowing
    kind: evidence_liveness
    unit: window
    of: latency_2500_prod
    max_stale_windows: 4

monitors:
  - name: latency_2500_prod
    requirement: latency_2500
    phase: runtime
    profile: backend_v1
    evidence: { source: backend_trace_metadata, deployment_environment: production }
    window: { tumbling_hours: 6, grace_minutes: 30 }
    decision:
      method: clopper_pearson_exact_v1
      confidence: 0.95
      false_alarm_budget: 0.05
      horizon_days: 30
      min_samples: 200
      max_unresolved_fraction: 0.05
    episode: { closure_windows: 2, closure_max_age_hours: 24 }
  - name: latency_back_in_48h_check
    requirement: latency_back_in_48h
    phase: runtime
    evidence: { source: episodes }
    decision: { method: exact_count_v1 }
  - name: latency_flowing_check
    requirement: latency_flowing
    phase: runtime
    evidence: { source: windows }
    decision: { method: exact_count_v1 }

responses:
  - name: latency_ladder
    rules:
      - { id: warn_open, trigger: { monitor: latency_2500_prod, event: episode_opened }, do: notify, severity: warning }
      - { id: next_step, trigger: { monitor: latency_2500_prod, event: episode_opened }, do: open_next_step }
      - { id: rollback_6h, trigger: { monitor: latency_2500_prod, event: episode_open_for, hours: 6 }, do: rollback, target: last_certified, approval: standing }
      - { id: suspend_overdue, trigger: { monitor: latency_back_in_48h_check, event: recovery_overdue }, do: suspend, approval: human, fallback: route_to_human }
      - { id: info_resolved, trigger: { monitor: latency_2500_prod, event: episode_resolved }, do: notify, severity: info }
