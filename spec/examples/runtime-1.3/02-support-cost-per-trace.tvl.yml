# Scenario 02: A customer-support bot may cost more than 0.50 USD on at most 2 % of production traces (customer-side census, exact-rational statistics).
tvl:
  module: examples.runtime13.support_cost_per_trace
tvl_version: "1.3"
environment:
  snapshot_id: "2026-10-16T00:00:00Z"
evaluation_set:
  dataset: support_cost_per_trace_eval
tvars:
  - name: model
    type: enum[str]
    domain: [m_small, m_large]
objectives:
  - name: quality
    direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02

requirements:
  - name: trace_cost_cap
    kind: rate_bound
    unit: trace
    violation: { metric: cost_usd, exceeds: 0.50 }
    max_rate: 0.02
  - name: cost_evidence_live
    kind: evidence_liveness
    unit: window
    of: trace_cost_cap_prod
    max_stale_windows: 3

monitors:
  - name: trace_cost_cap_prod
    requirement: trace_cost_cap
    phase: runtime
    evidence: { source: customer_side, deployment_environment: production }
    window: { tumbling_hours: 6, grace_minutes: 30 }
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      horizon_days: 30
      min_samples: 300
      max_unresolved_fraction: 0.05
    episode: { closure_windows: 2, closure_max_age_hours: 24 }
  - name: cost_evidence_live_check
    requirement: cost_evidence_live
    phase: runtime
    evidence: { source: windows }
    decision: { method: exact_count_v1 }

responses:
  - name: cost_alerts
    rules:
      - { id: warn_open, trigger: { monitor: trace_cost_cap_prod, event: episode_opened }, do: notify, severity: warning }
      - { id: info_resolved, trigger: { monitor: trace_cost_cap_prod, event: episode_resolved }, do: notify, severity: info }
