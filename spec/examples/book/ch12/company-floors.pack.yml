# Chapter 12: the company's floors, which every agent must meet. A pack is its own
# document: no tuned variables, objectives or evaluation set. TVL 1.3 is a draft.
tvl_version: "1.3"
pack:
  module: book.company_floors

requirements:
  - name: floor_slow_replies              # every agent: at most 4% of traces over 10 s
    kind: rate_bound
    unit: trace
    violation: { metric: wall_clock_latency_ms, exceeds: 10000 }
    max_rate: 0.04
  - name: floor_no_customer_delete        # no agent ever deletes a customer record
    kind: zero_tolerance
    unit: trace
    violation: { pattern: absence, a: { event: tool_call, tool: crm.delete_customer } }
  - name: floor_latency_evidence
    kind: evidence_liveness
    unit: window
    of: floor_slow_replies_prod
    max_stale_windows: 4
  - name: floor_delete_evidence
    kind: evidence_liveness
    unit: window
    of: floor_no_customer_delete_prod
    max_stale_windows: 2

monitors:
  - name: floor_slow_replies_prod
    requirement: floor_slow_replies
    phase: runtime
    applies_to: tenant_floor
    evidence: { source: customer_side, deployment_environment: production }
    window: { tumbling_hours: 6, grace_minutes: 30 }
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      horizon_days: 30
      min_samples: 200
      max_unresolved_fraction: 0.05
    episode: { closure_windows: 2, closure_max_age_hours: 24 }
  - name: floor_no_customer_delete_prod
    requirement: floor_no_customer_delete
    phase: runtime
    applies_to: tenant_floor
    evidence: { source: customer_side, deployment_environment: production }
    window: { tumbling_hours: 24, grace_minutes: 60 }
    decision: { method: exact_count_v1 }
    episode: { closure_windows: 1, closure_max_age_hours: 48 }
  - name: floor_latency_evidence_check
    requirement: floor_latency_evidence
    phase: runtime
    applies_to: tenant_floor
    evidence: { source: windows }
    decision: { method: exact_count_v1 }
  - name: floor_delete_evidence_check
    requirement: floor_delete_evidence
    phase: runtime
    applies_to: tenant_floor
    evidence: { source: windows }
    decision: { method: exact_count_v1 }

responses:
  - name: floor_alerts
    rules:
      - id: block_customer_delete
        trigger: { monitor: floor_no_customer_delete_prod, event: unit_violation }
        do: block_action
        on_check_error: block
      - id: page_on_delete
        trigger: { monitor: floor_no_customer_delete_prod, event: episode_opened }
        do: notify
        severity: critical
