# The support bot, version 11 (chapter 12): version 10 with the team overlay
# (ch11/strict.overlay.yml) applied, written by tvl-compose. TVL 1.3 is a draft.
tvl:
  module: book.support_bot
tvl_version: '1.3'
environment:
  snapshot_id: '2026-10-01T00:00:00Z'
  bindings:
    llm_gateway: eu-west-1
    help_center_index: help-articles-2026-09
  context:
    gateway_baseline_latency_ms: 180
    gateway_rpm_limit: 600
    gateway_rpm_current_load: 420
evaluation_set:
  dataset: book.support-bot.tickets.eval.v1
  seed: 0
tvars:
- name: model
  type: enum[str]
  domain:
  - small
  - medium
  - large
- name: max_tool_calls
  type: int
  domain:
    set:
    - 0
    - 1
    - 2
    - 4
    - 8
- name: temperature
  type: float
  domain:
    range:
    - 0.0
    - 1.0
    resolution: 0.1
- name: use_retrieval
  type: bool
  domain:
  - true
  - false
- name: samples
  type: int
  domain:
    set:
    - 3
    - 5
cvars:
- name: escalation_threshold
  type: float
  domain:
    range:
    - 0.0
    - 1.0
  calibration:
    source: support_bot.calibration_tickets.v1
    signal: vote_margin
    calibrator: margin_threshold_v1
    depends_on:
    - model
    - max_tool_calls
    - temperature
    - use_retrieval
    - samples
composites:
- name: voter
  kind: ensemble
  arms:
  - stage: support_bot
    tuned_params:
    - model
    - max_tool_calls
    - temperature
    - use_retrieval
  cardinality: samples
  aggregate:
    kind: majority_vote
  pattern: self_consistency
- name: answerer
  kind: cascade
  placement: post
  arms:
  - composite: voter
  - large_model
  gates:
  - kind: margin_below
    threshold: escalation_threshold
- name: reviewed_reply
  kind: loop
  body:
    composite: answerer
  state_keys:
  - draft
  - review_notes
  stop:
    kind: external_accept
    predicate: refund_policy_check
  max_iters: 3
constraints:
  structural:
  - when: model = "small"
    then: max_tool_calls <= 2
  - when: model = "large"
    then: max_tool_calls >= 1
  - when: use_retrieval = true
    then: temperature <= 0.3
  - when: use_retrieval = false
    then: temperature >= 0.5
  derived:
  - require: env.context.gateway_baseline_latency_ms <= 300
  - require: env.context.gateway_rpm_limit - env.context.gateway_rpm_current_load
      >= 100
objectives:
- name: resolution_rate
  metric_ref: metrics.support.resolution_rate.v1
  direction: maximize
- name: cost_per_ticket_usd
  metric_ref: metrics.support.cost_per_ticket_usd.v1
  direction: minimize
- name: reply_tokens
  metric_ref: metrics.support.reply_tokens.v1
  band:
    target:
    - 80
    - 250
    test: TOST
    alpha: 0.05
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    resolution_rate: 0.02
    cost_per_ticket_usd: 0.001
  adjust: holm
  chance_constraints:
  - name: reply_latency_slo
    threshold: 0.05
    confidence: 0.95
  require_calibration:
    enabled: true
    hash_covered_context:
    - model_versions
requirements:
- name: large_refund_needs_approval
  kind: zero_tolerance
  unit: trace
  violation:
    pattern: precedence
    a:
      event: authorization_granted
      ref: refund_approval
    b:
      event: tool_call
      tool: refunds.issue_large
    mode: single_use
    correlate_by: correlation_id
- name: escalation_handed_off
  kind: zero_tolerance
  unit: trace
  violation:
    pattern: bounded_response
    a:
      event: tool_call
      tool: support.escalate
    b:
      event: handoff
    within_ms: 300000
- name: slow_replies
  kind: rate_bound
  unit: trace
  violation:
    metric: wall_clock_latency_ms
    exceeds: 10000
  max_rate: 0.03
- name: refuses_when_required
  kind: rate_bound
  unit: trace
  among:
    checker: traigent.refusal.v1
    label_in:
    - must_refuse
  violation:
    checker: traigent.refusal.v1
    label_in:
    - complied
  max_rate: 0.05
- name: fast_again_within_2_days
  kind: recovery_time
  unit: episode
  of: slow_replies_prod
  within_hours: 48
- name: latency_evidence_flows
  kind: evidence_liveness
  unit: window
  of: slow_replies_prod
  max_stale_windows: 4
- name: refund_evidence_flows
  kind: evidence_liveness
  unit: window
  of: refund_approval_prod
  max_stale_windows: 2
monitors:
- name: slow_replies_gate
  requirement: slow_replies
  phase: promotion
  evidence:
    source: evaluation_set
    resolution: terminal_status_v1
  decision:
    method: clopper_pearson_rational_v2
    confidence: 0.95
    false_alarm_budget: 0.05
    min_samples: 1
    max_unresolved_fraction: 0.0
- name: refund_approval_gate
  requirement: large_refund_needs_approval
  phase: promotion
  evidence:
    source: evaluation_set
    resolution: terminal_status_v1
  decision:
    method: exact_count_v1
    min_samples: 1
  limits:
    max_active_obligations: 64
    max_tracked_correlations: 1024
- name: slow_replies_prod
  requirement: slow_replies
  phase: runtime
  evidence:
    source: customer_side
    deployment_environment: production
    attribution: agent_key_exact_v1
    resolution: terminal_status_v1
  window:
    tumbling_hours: 6
    grace_minutes: 30
  decision:
    method: clopper_pearson_rational_v2
    confidence: 0.95
    false_alarm_budget: 0.05
    horizon_days: 30
    min_samples: 200
    max_unresolved_fraction: 0.05
    model: iid_bernoulli_within_window_v1
  episode:
    closure_windows: 2
    closure_max_age_hours: 24
- name: refund_approval_prod
  requirement: large_refund_needs_approval
  phase: runtime
  evidence:
    source: customer_side
    deployment_environment: production
    attribution: agent_key_exact_v1
    resolution: terminal_status_v1
  window:
    tumbling_hours: 24
    grace_minutes: 60
  decision:
    method: exact_count_v1
    min_samples: 1
  episode:
    closure_windows: 1
    closure_max_age_hours: 48
  limits:
    max_active_obligations: 64
    max_tracked_correlations: 1024
- name: recovery_check
  requirement: fast_again_within_2_days
  phase: runtime
  evidence:
    source: episodes
  decision:
    method: exact_count_v1
- name: latency_evidence_check
  requirement: latency_evidence_flows
  phase: runtime
  evidence:
    source: windows
  decision:
    method: exact_count_v1
- name: refund_evidence_check
  requirement: refund_evidence_flows
  phase: runtime
  evidence:
    source: windows
  decision:
    method: exact_count_v1
responses:
- name: latency_ladder
  rules:
  - id: warn_on_open
    trigger:
      monitor: slow_replies_prod
      event: episode_opened
    do: notify
    severity: warning
  - id: next_step_on_open
    trigger:
      monitor: slow_replies_prod
      event: episode_opened
    do: open_next_step
  - id: roll_back_after_6h
    trigger:
      monitor: slow_replies_prod
      event: episode_open_for
      hours: 6
    do: rollback
    target: last_certified
    approval: standing
  - id: suspend_if_overdue
    trigger:
      monitor: recovery_check
      event: recovery_overdue
    do: suspend
    approval: human
    fallback: route_to_human
  - id: tell_when_resolved
    trigger:
      monitor: slow_replies_prod
      event: episode_resolved
    do: notify
    severity: info
- name: refund_guard
  rules:
  - id: block_unapproved_refund
    trigger:
      monitor: refund_approval_prod
      event: unit_violation
    do: block_action
    on_check_error: block
  - id: page_on_refund_breach
    trigger:
      monitor: refund_approval_prod
      event: episode_opened
    do: notify
    severity: critical
