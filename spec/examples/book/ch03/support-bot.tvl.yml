# The support bot, version 2 (chapter 3): four knobs, four types.
tvl:
  module: book.support_bot

environment:
  snapshot_id: "2026-10-01T00:00:00Z"

evaluation_set:
  dataset: datasets/support-tickets-v1.jsonl
  seed: 7

tvars:
  - name: model                 # a choice from a list of names
    type: enum[str]
    domain: ["small", "medium", "large"]
  - name: max_tool_calls        # a whole number from a list
    type: int
    domain:
      set: [0, 1, 2, 4, 8]
  - name: temperature           # a number on a grid: 0.0, 0.1, ..., 1.0
    type: float
    domain:
      range: [0.0, 1.0]
      resolution: 0.1
  - name: use_retrieval         # search the help articles first, or not
    type: bool
    domain: [true, false]

constraints:
  structural:
    - when: model = "small"
      then: max_tool_calls <= 2

objectives:
  - name: resolution_rate
    direction: maximize
  - name: cost_per_ticket_usd
    direction: minimize

promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    resolution_rate: 0.02
    cost_per_ticket_usd: 0.001
