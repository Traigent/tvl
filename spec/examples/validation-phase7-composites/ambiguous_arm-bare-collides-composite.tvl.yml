# Expected: ERROR ambiguous_arm — a bare arm id colliding with a composite name
# is rejected (use the tagged {composite: ...} form to nest). §3.2 item 3.
tvl:
  module: corp.validation.p7
environment:
  snapshot_id: '2026-06-06T00:00:00Z'
evaluation_set:
  dataset: s3://datasets/validation/dev.parquet
tvars:
- name: cheap_model
  type: enum[str]
  domain:
  - a
  - b
- name: strong_model
  type: enum[str]
  domain:
  - c
  - d
- name: k_samples
  type: int
  domain:
    range:
    - 1
    - 9
cvars:
- name: router.theta
  type: float
  calibration:
    source: pool
    signal: vote_margin
    depends_on:
    - cheap_model
constraints:
  structural: []
objectives:
- name: quality
  direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02
composites:
- name: expert
  kind: ensemble
  arms:
  - stage: s
  cardinality: k_samples
  aggregate:
    kind: majority_vote
- name: answerer
  kind: cascade
  placement: post
  arms:
  - expert
  - stage: strong_stage
  gates:
  - kind: margin_below
    threshold: router.theta
