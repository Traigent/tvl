# Expected: VALID — a sampling-form (|arms|=1) ensemble with a tuned cardinality.
# §3.2 item 7.
tvl:
  module: corp.validation.p7
environment:
  snapshot_id: '2026-06-06T00:00:00Z'
evaluation_set:
  dataset: s3://datasets/validation/dev.parquet
tvars:
- name: cheap_model
  type: enum[str]
  domain:
  - a
  - b
- name: strong_model
  type: enum[str]
  domain:
  - c
  - d
- name: k_samples
  type: int
  domain:
    range:
    - 1
    - 9
cvars:
- name: vote.theta
  type: float
  calibration:
    source: pool
    signal: vote_margin
    depends_on:
    - cheap_model
    - k_samples
constraints:
  structural: []
objectives:
- name: quality
  direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02
composites:
- name: voter
  kind: ensemble
  arms:
  - stage: s
    tuned_params:
    - cheap_model
  cardinality: k_samples
  aggregate:
    kind: majority_vote
    accept:
      kind: stat_at_least
      stat: vote_margin
      threshold: vote.theta
