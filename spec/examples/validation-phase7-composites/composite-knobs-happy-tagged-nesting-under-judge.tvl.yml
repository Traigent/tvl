# Expected: VALID — tagged {composite: ...} nesting in the ensemble judge
# position. §3.9.
tvl:
  module: corp.validation.p7
environment:
  snapshot_id: '2026-06-06T00:00:00Z'
evaluation_set:
  dataset: s3://datasets/validation/dev.parquet
tvars:
- name: cheap_model
  type: enum[str]
  domain:
  - a
  - b
- name: strong_model
  type: enum[str]
  domain:
  - c
  - d
- name: k_samples
  type: int
  domain:
    range:
    - 1
    - 9
cvars:
- name: router.theta
  type: float
  calibration:
    source: pool
    signal: vote_margin
    depends_on: []
constraints:
  structural: []
objectives:
- name: quality
  direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02
composites:
- name: inner
  kind: cascade
  placement: post
  arms:
  - stage: a
  - stage: b
  gates:
  - kind: margin_below
    threshold: router.theta
- name: scored
  kind: ensemble
  arms:
  - stage: s
  cardinality: k_samples
  aggregate:
    kind: judge_max
    judge:
      composite: inner
