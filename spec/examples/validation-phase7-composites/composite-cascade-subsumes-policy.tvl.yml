# Expected: VALID — the composite form of the legacy cascade above, with the two
# intended ratchets satisfied (per-arm tuned_params declared; threshold CVAR's
# calibration.signal = vote_margin). Execution semantics are identical to the
# policies form (§4); the lints differ ONLY by the two composite-only ratchets.
tvl:
  module: corp.validation.p7
environment:
  snapshot_id: '2026-06-06T00:00:00Z'
evaluation_set:
  dataset: s3://datasets/validation/dev.parquet
tvars:
- name: cheap_model
  type: enum[str]
  domain:
  - a
  - b
- name: strong_model
  type: enum[str]
  domain:
  - c
  - d
- name: k_samples
  type: int
  domain:
    range:
    - 1
    - 9
cvars:
- name: router.theta
  type: float
  calibration:
    source: pool
    signal: vote_margin
    depends_on:
    - cheap_model
constraints:
  structural: []
objectives:
- name: quality
  direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02
composites:
- name: cheap_strong
  kind: cascade
  placement: post
  arms:
  - stage: cheap
    tuned_params:
    - cheap_model
  - stage: strong
  gates:
  - kind: margin_below
    threshold: router.theta
  pattern: binary_cascade
