# Expected: ERROR gate_arm_incompatible — margin_below gates a non-margin-bearing
# arm (a judge_max ensemble yields a score, not a vote margin). §3.2 item 5.
tvl:
  module: corp.validation.p7
environment:
  snapshot_id: '2026-06-06T00:00:00Z'
evaluation_set:
  dataset: s3://datasets/validation/dev.parquet
tvars:
- name: cheap_model
  type: enum[str]
  domain:
  - a
  - b
- name: strong_model
  type: enum[str]
  domain:
  - c
  - d
- name: k_samples
  type: int
  domain:
    range:
    - 1
    - 9
cvars:
- name: router.theta
  type: float
  calibration:
    source: pool
    signal: vote_margin
    depends_on:
    - k_samples
constraints:
  structural: []
objectives:
- name: quality
  direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02
composites:
- name: scored
  kind: ensemble
  arms:
  - stage: s
  cardinality: k_samples
  aggregate:
    kind: judge_max
    judge:
      stage: judge_stage
- name: answerer
  kind: cascade
  placement: post
  arms:
  - composite: scored
  - stage: strong_stage
  gates:
  - kind: margin_below
    threshold: router.theta
