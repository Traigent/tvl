# Expected: VALID — a CVAR whose calibration.signal is absent is well-formed on
# its own; missing_calibration_signal / signal_mismatch / unbound_signal_inputs
# fire ONLY at a composite use site, never on a cvars block in isolation. §3.2 item 11.
tvl:
  module: corp.validation.p7
environment:
  snapshot_id: '2026-06-06T00:00:00Z'
evaluation_set:
  dataset: s3://datasets/validation/dev.parquet
tvars:
- name: cheap_model
  type: enum[str]
  domain:
  - a
  - b
- name: strong_model
  type: enum[str]
  domain:
  - c
  - d
- name: k_samples
  type: int
  domain:
    range:
    - 1
    - 9
cvars:
- name: lonely.theta
  type: float
  calibration:
    source: pool
    depends_on:
    - cheap_model
constraints:
  structural: []
objectives:
- name: quality
  direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02
