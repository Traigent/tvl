# Expected: VALID — a legacy policies: cascade is unchanged under TVL 1.2; the two
# composite-only ratchets (empty-tuned_params parent coverage, signal binding)
# do NOT fire on the policies form even though router.theta omits calibration.signal.
# §4 subsumption / P1.
tvl:
  module: corp.validation.p7
environment:
  snapshot_id: '2026-06-06T00:00:00Z'
evaluation_set:
  dataset: s3://datasets/validation/dev.parquet
tvars:
- name: cheap_model
  type: enum[str]
  domain:
  - a
  - b
- name: strong_model
  type: enum[str]
  domain:
  - c
  - d
- name: k_samples
  type: int
  domain:
    range:
    - 1
    - 9
cvars:
- name: router.theta
  type: float
  calibration:
    source: pool
    depends_on:
    - cheap_model
constraints:
  structural: []
objectives:
- name: quality
  direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02
policies:
- name: cheap_strong
  kind: policy
  strategy: cascade
  stages:
  - cheap
  - strong
  gates:
  - kind: margin_below
    threshold: router.theta
