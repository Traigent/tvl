# Expected: VALID — a degenerate m=1 cascade has no gates and always returns its
# arm. §3.2 item 2.
tvl:
  module: corp.validation.p7
environment:
  snapshot_id: '2026-06-06T00:00:00Z'
evaluation_set:
  dataset: s3://datasets/validation/dev.parquet
tvars:
- name: cheap_model
  type: enum[str]
  domain:
  - a
  - b
- name: strong_model
  type: enum[str]
  domain:
  - c
  - d
- name: k_samples
  type: int
  domain:
    range:
    - 1
    - 9
cvars: []
constraints:
  structural: []
objectives:
- name: quality
  direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02
composites:
- name: single
  kind: cascade
  placement: post
  arms:
  - stage: only
    tuned_params:
    - cheap_model
