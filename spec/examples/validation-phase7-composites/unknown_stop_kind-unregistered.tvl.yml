# Expected: ERROR unknown_stop_kind — stop.kind outside the v1 registry
# (signal_accept | external_accept | exhausted). §3.2 StopDecl.
tvl:
  module: corp.validation.p7
environment:
  snapshot_id: '2026-06-06T00:00:00Z'
evaluation_set:
  dataset: s3://datasets/validation/dev.parquet
tvars:
- name: cheap_model
  type: enum[str]
  domain:
  - a
  - b
- name: strong_model
  type: enum[str]
  domain:
  - c
  - d
- name: k_samples
  type: int
  domain:
    range:
    - 1
    - 9
cvars: []
constraints:
  structural: []
objectives:
- name: quality
  direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02
composites:
- name: looper
  kind: loop
  body:
    stage: s
  state_keys: []
  stop:
    kind: converged
  max_iters: 3
