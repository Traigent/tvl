# Expected: ERROR unknown_aggregate_kind — aggregate kind outside the v1 registry
# (majority_vote | judge_max). §3.2 AggregateDecl.
tvl:
  module: corp.validation.p7
environment:
  snapshot_id: '2026-06-06T00:00:00Z'
evaluation_set:
  dataset: s3://datasets/validation/dev.parquet
tvars:
- name: cheap_model
  type: enum[str]
  domain:
  - a
  - b
- name: strong_model
  type: enum[str]
  domain:
  - c
  - d
- name: k_samples
  type: int
  domain:
    range:
    - 1
    - 9
cvars: []
constraints:
  structural: []
objectives:
- name: quality
  direction: maximize
promotion_policy:
  dominance: epsilon_pareto
  alpha: 0.05
  min_effect:
    quality: 0.02
composites:
- name: voter
  kind: ensemble
  arms:
  - stage: s
  cardinality: k_samples
  aggregate:
    kind: weighted_vote
