<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/traigent-logo.png" />
    <title>Page not found | TVL</title>
    <meta name="description" content="The page you requested does not exist on tvl-lang.org." />
    <meta name="robots" content="noindex,nofollow" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
        --border: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1120;
          --fg: #e2e8f0;
          --muted: #94a3b8;
          --accent: #60a5fa;
          --border: #1e293b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 3.5rem;
        line-height: 1.1;
      }
      h2 {
        margin: 0 0 1rem;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--muted);
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a {
        padding: 0.5rem 1rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
      }
      a:hover,
      a:focus-visible {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>The page you are looking for does not exist, or it has moved.</p>
      <nav aria-label="Site sections">
        <a href="/">Home</a>
        <a href="/specification">Specification</a>
        <a href="/examples">Examples</a>
        <a href="https://github.com/Traigent/tvl" rel="noopener noreferrer">GitHub</a>
      </nav>
    </main>
  </body>
</html>
