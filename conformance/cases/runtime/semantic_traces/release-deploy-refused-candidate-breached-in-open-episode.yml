case_format: tvl-runtime-case/1
family: semantic_traces
description: 'RFC 0011 2.6 item 3.4 and 2.13 item 5: the configuration serving when EP1 opened (F0) breached
  in the open episode. A2''s candidate is F0 and the head, generation and rollback target all match, so
  only the breached-configuration check can refuse it.'
spec_refs:
- formalization/rfc-0011-tuning-conditions.md#2.6
- formalization/rfc-0011-tuning-conditions.md#2.13
- formalization/rfc-0012-release-acceptance.md#2.3
module:
  tvl_version: '1.7'
  tvl:
    module: slice.ticket_router
  environment:
    snapshot_id: '2026-11-20T00:00:00Z'
  evaluation_set:
    dataset: test://slice
  tvars:
  - name: model
    type: enum[str]
    domain:
    - anthropic/claude-haiku-4-5
    - anthropic/claude-sonnet-4-6
  objectives:
  - name: quality
    direction: maximize
  promotion_policy:
    dominance: epsilon_pareto
    alpha: 0.05
    min_effect:
      quality: 0.02
  requirements:
  - name: quality_floor
    kind: rate_bound
    unit: invocation
    violation:
      checker: customer:ticket_route_check
      label_in:
      - fail
    max_rate: 0.08
  - name: recover
    kind: recovery_time
    unit: episode
    of: quality_prod
    within_hours: 96
  monitors:
  - name: quality_prod
    requirement: quality_floor
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: production
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
      sampling:
        mode: hash_bernoulli_committed_v1
        rate: 0.02
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      min_samples: 200
      max_unresolved_fraction: 0.05
      horizon_days: 30
      model: iid_bernoulli_within_window_v1
    window:
      tumbling_hours: 24
      grace_minutes: 0
    episode:
      closure_windows: 2
      closure_max_age_hours: 168
      closure_scope: since_head_move
  - name: quality_gate
    requirement: quality_floor
    phase: promotion
    evidence:
      source: evaluation_set
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
  - name: recover_monitor
    requirement: recover
    phase: runtime
    evidence:
      source: episodes
    decision:
      method: exact_count_v1
  responses:
  - name: tuning
    rules:
    - id: a_fix
      trigger:
        monitor: quality_prod
        event: episode_opened
      do: optimize
      approval: standing
      deploy: if_promoted
    - id: b_fix
      trigger:
        monitor: quality_prod
        event: episode_opened
      do: optimize
      approval: standing
      deploy: if_promoted
