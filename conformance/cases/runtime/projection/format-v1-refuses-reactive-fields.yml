case_format: tvl-runtime-case/1
family: projection
description: A /1 contract with 1.3 version refuses TVL 1.4 fields
spec_refs:
- formalization/rfc-0004-reactive-outcomes-and-guards.md#3
module:
  tvl:
    module: conformance.runtime
  tvl_version: '1.4'
  environment:
    snapshot_id: '2026-10-16T00:00:00Z'
  evaluation_set:
    dataset: test://runtime
  tvars:
  - name: model_choice
    type: enum[str]
    domain:
    - small
    - large
  objectives:
  - name: quality
    direction: maximize
  promotion_policy:
    dominance: epsilon_pareto
    alpha: 0.05
    min_effect:
      quality: 0.02
  requirements:
  - name: requirement_main
    kind: rate_bound
    unit: invocation
    violation:
      metric: wall_clock_latency_ms
      exceeds: 2000
    max_rate: 0.05
  monitors:
  - name: monitor_main
    requirement: requirement_main
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: production
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
      sampling:
        mode: head_sampled_declared
        rate: 0.5
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      min_samples: 200
      max_unresolved_fraction: 0.05
      horizon_days: 30
      model: iid_bernoulli_within_window_v1
    applies_to: agent
    window:
      tumbling_hours: 6
      grace_minutes: 30
    episode:
      closure_windows: 2
      closure_max_age_hours: 24
  - name: monitor_gate
    requirement: requirement_main
    phase: promotion
    evidence:
      source: evaluation_set
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
  - name: monitor_other
    requirement: requirement_main
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: staging
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
      sampling:
        mode: head_sampled_declared
        rate: 0.5
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      min_samples: 200
      max_unresolved_fraction: 0.05
      horizon_days: 30
      model: iid_bernoulli_within_window_v1
    applies_to: agent
    window:
      tumbling_hours: 6
      grace_minutes: 30
    episode:
      closure_windows: 2
      closure_max_age_hours: 24
  responses:
  - name: repair
    rules:
    - id: opt
      trigger:
        monitor: monitor_main
        event: episode_opened
      do: optimize
      approval: human
      deploy: if_promoted
    - id: outcome
      trigger:
        rule: opt
        event: optimize_no_candidate
      do: notify
      only_while:
      - monitor: monitor_other
        state: episode_open
      unless:
      - rule: opt
        state: attempt_open
    - id: unknown
      trigger:
        monitor: monitor_main
        event: unknown_for
        hours: 6
      do: notify
input:
  kind: projection
  token_map:
  - namespace: module
    local: conformance.runtime
    hosted: ref_0
  - namespace: requirement
    local: requirement_main
    hosted: ref_1
  - namespace: monitor
    local: monitor_main
    hosted: ref_2
  - namespace: environment
    local: production
    hosted: ref_3
  - namespace: monitor
    local: monitor_gate
    hosted: ref_4
  - namespace: monitor
    local: monitor_other
    hosted: ref_5
  - namespace: environment
    local: staging
    hosted: ref_6
  - namespace: response
    local: repair
    hosted: ref_7
  - namespace: rule
    local: opt
    hosted: ref_8
  - namespace: rule
    local: outcome
    hosted: ref_9
  - namespace: rule
    local: unknown
    hosted: ref_10
  contract_format: tvl-runtime-contract/1
  contract_version: '1.3'
expected:
  error: runtime_unsafe_egress
