case_format: tvl-runtime-case/1
family: projection
description: aggregates project to closed operator, metric, direction, source digest and a minimal decimal
  bound
spec_refs:
- formalization/rfc-0005-persistence-and-census-aggregates.md#25
module:
  tvl:
    module: conformance.runtime
  tvl_version: '1.5'
  environment:
    snapshot_id: '2026-10-16T00:00:00Z'
  evaluation_set:
    dataset: test://runtime
  tvars:
  - name: model_choice
    type: enum[str]
    domain:
    - small
    - large
  objectives:
  - name: quality
    direction: maximize
  promotion_policy:
    dominance: epsilon_pareto
    alpha: 0.05
    min_effect:
      quality: 0.02
  requirements:
  - name: daily_spend
    kind: aggregate_bound
    unit: invocation
    aggregate:
      op: sum
      metric: cost_usd
      source_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    bound:
      lte: 50
  monitors:
  - name: daily_spend_prod
    requirement: daily_spend
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: production
    window:
      tumbling_hours: 24
      grace_minutes: 30
    decision:
      method: exact_aggregate_v1
    episode:
      closure_windows: 2
      closure_max_age_hours: 72
  responses:
  - name: repair
    rules:
    - id: page
      trigger:
        monitor: daily_spend_prod
        event: episode_opened
      do: notify
      severity: critical
input:
  kind: projection
  token_map:
  - namespace: module
    local: conformance.runtime
    hosted: opaque_module
  - namespace: requirement
    local: daily_spend
    hosted: opaque_daily_spend
  - namespace: monitor
    local: daily_spend_prod
    hosted: opaque_daily_spend_prod
  - namespace: environment
    local: production
    hosted: opaque_env
  - namespace: response
    local: repair
    hosted: opaque_repair
  - namespace: rule
    local: page
    hosted: opaque_page
expected:
  projected_fields:
    /format: tvl-runtime-contract/3
    /tvl_version: '1.5'
    /declarations/requirements/0/aggregate/op: sum
    /declarations/requirements/0/aggregate/metric: cost_usd
    /declarations/requirements/0/aggregate/source_digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    /declarations/requirements/0/bound/lte: '50'
    /declarations/monitors/0/decision/method: exact_aggregate_v1
    /declarations/monitors/0/window/tumbling_hours: 24
