case_format: tvl-runtime-case/1
family: projection
description: protocol states tokenized
spec_refs:
- formalization/tvl-formal-semantics.md#12.13
module:
  tvl:
    module: conformance.runtime
  tvl_version: '1.3'
  environment:
    snapshot_id: '2026-10-16T00:00:00Z'
  evaluation_set:
    dataset: test://runtime
  tvars:
  - name: model_choice
    type: enum[str]
    domain:
    - small
    - large
  objectives:
  - name: quality
    direction: maximize
  promotion_policy:
    dominance: epsilon_pareto
    alpha: 0.05
    min_effect:
      quality: 0.02
  requirements:
  - name: requirement_main
    kind: rate_bound
    unit: invocation
    violation:
      pattern: protocol
      alphabet:
      - event: model_call
      states:
      - CANARY_START
      - CANARY_DONE
      start: CANARY_START
      transitions:
      - from: CANARY_START
        when:
          event: model_call
        to: CANARY_DONE
      accepting:
      - CANARY_DONE
      rejecting: []
    max_rate: 0.05
  monitors:
  - name: monitor_main
    requirement: requirement_main
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: production
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
      sampling:
        mode: head_sampled_declared
        rate: 0.5
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      min_samples: 200
      max_unresolved_fraction: 0.05
      horizon_days: 30
      model: iid_bernoulli_within_window_v1
    applies_to: agent
    window:
      tumbling_hours: 6
      grace_minutes: 30
    episode:
      closure_windows: 2
      closure_max_age_hours: 24
    limits:
      max_active_obligations: 100
      max_tracked_correlations: 100
input:
  kind: projection
  token_map:
  - namespace: module
    local: conformance.runtime
    hosted: opaque_module
  - namespace: environment
    local: production
    hosted: opaque_environment
  - namespace: requirement
    local: requirement_main
    hosted: opaque_req_2
  - namespace: monitor
    local: monitor_main
    hosted: opaque_mon_3
  - namespace: state
    local: CANARY_START
    hosted: opaque_state0
  - namespace: state
    local: CANARY_DONE
    hosted: opaque_state1
expected:
  projected_fields:
    /declarations/requirements/0/violation/states:
    - opaque_state0
    - opaque_state1
    /declarations/requirements/0/violation/start: opaque_state0
    /declarations/requirements/0/violation/transitions/0/from: opaque_state0
    /declarations/requirements/0/violation/transitions/0/to: opaque_state1
  forbidden_substrings:
  - CANARY_
