case_format: tvl-runtime-case/1
family: projection
description: a /3 contract without a 1.5 construct is refused
spec_refs:
- formalization/rfc-0005-persistence-and-census-aggregates.md#25
module:
  tvl:
    module: conformance.runtime
  tvl_version: '1.4'
  environment:
    snapshot_id: '2026-10-16T00:00:00Z'
  evaluation_set:
    dataset: test://runtime
  tvars:
  - name: model_choice
    type: enum[str]
    domain:
    - small
    - large
  objectives:
  - name: quality
    direction: maximize
  promotion_policy:
    dominance: epsilon_pareto
    alpha: 0.05
    min_effect:
      quality: 0.02
  requirements:
  - name: requirement_main
    kind: rate_bound
    unit: invocation
    violation:
      metric: wall_clock_latency_ms
      exceeds: 2000
    max_rate: 0.05
  monitors:
  - name: monitor_main
    requirement: requirement_main
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: production
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
      sampling:
        mode: head_sampled_declared
        rate: 0.5
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      min_samples: 200
      max_unresolved_fraction: 0.05
      horizon_days: 30
      model: iid_bernoulli_within_window_v1
    applies_to: agent
    window:
      tumbling_hours: 6
      grace_minutes: 30
    episode:
      closure_windows: 2
      closure_max_age_hours: 24
  - name: monitor_gate
    requirement: requirement_main
    phase: promotion
    evidence:
      source: evaluation_set
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
  responses:
  - name: repair
    rules:
    - id: next
      trigger:
        monitor: monitor_main
        event: episode_opened
      do: open_next_step
      approval: none
    - id: opt
      trigger:
        monitor: monitor_main
        event: episode_opened
      do: optimize
      approval: human
      deploy: if_promoted
    - id: opt_default
      trigger:
        monitor: monitor_main
        event: episode_continued
      do: optimize
      approval: standing
input:
  kind: projection
  token_map:
  - namespace: module
    local: conformance.runtime
    hosted: opaque_module
  - namespace: environment
    local: production
    hosted: opaque_environment
  - namespace: requirement
    local: requirement_main
    hosted: opaque_req
  - namespace: monitor
    local: monitor_main
    hosted: opaque_mon
  - namespace: monitor
    local: monitor_gate
    hosted: opaque_gate
  - namespace: response
    local: repair
    hosted: opaque_resp
  - namespace: rule
    local: next
    hosted: opaque_rule_next
  - namespace: rule
    local: opt
    hosted: opaque_rule_opt
  - namespace: rule
    local: opt_default
    hosted: opaque_rule_opt_default
  contract_format: tvl-runtime-contract/3
  contract_version: '1.5'
expected:
  error: runtime_unsafe_egress
