case_format: tvl-runtime-case/1
family: projection
description: pack module tokenized
spec_refs:
- formalization/tvl-formal-semantics.md#12.13
pack:
  tvl_version: '1.3'
  pack:
    module: CANARY_PACK
  requirements:
  - name: requirement_main
    kind: rate_bound
    unit: invocation
    violation:
      metric: wall_clock_latency_ms
      exceeds: 2000
    max_rate: 0.05
  monitors:
  - name: monitor_main
    requirement: requirement_main
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: production
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
      sampling:
        mode: head_sampled_declared
        rate: 0.5
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      min_samples: 200
      max_unresolved_fraction: 0.05
      horizon_days: 30
      model: iid_bernoulli_within_window_v1
    applies_to: tenant_floor
    window:
      tumbling_hours: 6
      grace_minutes: 30
    episode:
      closure_windows: 2
      closure_max_age_hours: 24
input:
  kind: projection
  token_map:
  - namespace: module
    local: CANARY_PACK
    hosted: opaque_pack
  - namespace: requirement
    local: requirement_main
    hosted: opaque_req
  - namespace: monitor
    local: monitor_main
    hosted: opaque_mon
  - namespace: environment
    local: production
    hosted: opaque_environment
expected:
  projected_fields:
    /declarations/pack/module: opaque_pack
  forbidden_substrings:
  - CANARY_PACK
