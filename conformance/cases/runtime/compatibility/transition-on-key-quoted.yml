expected:
  error: schema_error
  exit_code: 2
module:
  tvl:
    module: conformance.runtime
  tvl_version: '1.3'
  environment:
    snapshot_id: '2026-10-16T00:00:00Z'
  evaluation_set:
    dataset: test://runtime
  tvars:
  - name: model_choice
    type: enum[str]
    domain:
    - small
    - large
  objectives:
  - name: quality
    direction: maximize
  promotion_policy:
    dominance: epsilon_pareto
    alpha: 0.05
    min_effect:
      quality: 0.02
  requirements:
  - name: requirement_main
    kind: rate_bound
    unit: invocation
    violation:
      pattern: protocol
      alphabet:
      - event: authorization_granted
      - event: tool_call
        tool: execute
      states:
      - start
      - ready
      - done
      - bad
      start: start
      transitions:
      - from: start
        when:
          event: authorization_granted
        to: ready
      - from: ready
        when:
          event: tool_call
          tool: execute
        to: done
      accepting:
      - done
      rejecting:
      - bad
    max_rate: 0.05
  monitors:
  - name: monitor_main
    requirement: requirement_main
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: production
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
      sampling:
        mode: head_sampled_declared
        rate: 0.5
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      min_samples: 200
      max_unresolved_fraction: 0.05
      horizon_days: 30
      model: iid_bernoulli_within_window_v1
    applies_to: agent
    window:
      tumbling_hours: 6
      grace_minutes: 30
    episode:
      closure_windows: 2
      closure_max_age_hours: 24
    single_producer: true
    limits:
      max_active_obligations: 100
      max_tracked_correlations: 100
