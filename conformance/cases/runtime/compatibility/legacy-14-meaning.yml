case_format: tvl-runtime-case/1
family: compatibility
description: 'a valid 1.4 module keeps its diagnostics: no RFC 0005 code appears'
spec_refs:
- formalization/rfc-0005-persistence-and-census-aggregates.md#3
module:
  tvl:
    module: conformance.runtime
  tvl_version: '1.4'
  environment:
    snapshot_id: '2026-10-16T00:00:00Z'
  evaluation_set:
    dataset: test://runtime
  tvars:
  - name: model_choice
    type: enum[str]
    domain:
    - small
    - large
  objectives:
  - name: quality
    direction: maximize
  promotion_policy:
    dominance: epsilon_pareto
    alpha: 0.05
    min_effect:
      quality: 0.02
  requirements:
  - name: requirement_main
    kind: rate_bound
    unit: invocation
    violation:
      metric: wall_clock_latency_ms
      exceeds: 2000
    max_rate: 0.05
  monitors:
  - name: monitor_main
    requirement: requirement_main
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: production
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
      sampling:
        mode: head_sampled_declared
        rate: 0.5
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      min_samples: 200
      max_unresolved_fraction: 0.05
      horizon_days: 30
      model: iid_bernoulli_within_window_v1
    applies_to: agent
    window:
      tumbling_hours: 6
      grace_minutes: 30
    episode:
      closure_windows: 2
      closure_max_age_hours: 24
  - name: monitor_gate
    requirement: requirement_main
    phase: promotion
    evidence:
      source: evaluation_set
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
  - name: monitor_other
    requirement: requirement_main
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: staging
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
      sampling:
        mode: head_sampled_declared
        rate: 0.5
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      min_samples: 200
      max_unresolved_fraction: 0.05
      horizon_days: 30
      model: iid_bernoulli_within_window_v1
    applies_to: agent
    window:
      tumbling_hours: 6
      grace_minutes: 30
    episode:
      closure_windows: 2
      closure_max_age_hours: 24
  responses:
  - name: repair
    rules:
    - id: opt
      trigger:
        monitor: monitor_main
        event: episode_opened
      do: optimize
      approval: human
      deploy: if_promoted
    - id: outcome
      trigger:
        rule: opt
        event: optimize_no_candidate
      do: notify
      only_while:
      - monitor: monitor_other
        state: episode_open
      unless:
      - rule: opt
        state: attempt_open
    - id: unknown
      trigger:
        monitor: monitor_main
        event: unknown_for
        hours: 6
      do: notify
input:
  kind: lint
  operation: validate
expected:
  absent_diagnostics:
  - runtime_persistence_out_of_range
  - runtime_invalid_persistence
  - runtime_aggregate_bound_out_of_range
  - runtime_report_numeric
  - declared_version_below_constructs
  - runtime_version_required
