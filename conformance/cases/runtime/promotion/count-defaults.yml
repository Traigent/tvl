case_format: tvl-runtime-case/1
family: promotion
description: count defaults
spec_refs:
- formalization/rfc-0003-runtime-requirements-monitors-responses.md#6.11
- formalization/rfc-0003-runtime-requirements-monitors-responses.md#11.3
- formalization/rfc-0003-runtime-requirements-monitors-responses.md#11.4.2
module:
  tvl:
    module: conformance.runtime
  tvl_version: '1.3'
  environment:
    snapshot_id: '2026-10-16T00:00:00Z'
  evaluation_set:
    dataset: test://runtime
  tvars:
  - name: model_choice
    type: enum[str]
    domain:
    - small
    - large
  objectives:
  - name: quality
    direction: maximize
  promotion_policy:
    dominance: epsilon_pareto
    alpha: 0.05
    min_effect:
      quality: 0.02
  requirements:
  - name: requirement_main
    kind: rate_bound
    unit: invocation
    violation:
      metric: wall_clock_latency_ms
      exceeds: 2000
    max_rate: 0.05
  monitors:
  - name: monitor_main
    requirement: requirement_main
    phase: promotion
    evidence:
      source: evaluation_set
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
input:
  kind: measurement
  role: candidate
  monitor_outcomes:
    monitor_main:
      n: 100
      k: 0
expected:
  readiness_issues: []
  normalized_monitor_outcomes:
    monitor_main:
      n: 100
      k: 0
      u: 0
      pl: 0
