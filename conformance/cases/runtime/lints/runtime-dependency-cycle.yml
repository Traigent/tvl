case_format: tvl-runtime-case/1
family: lints
description: runtime dependency cycle
spec_refs:
- formalization/rfc-0003-runtime-requirements-monitors-responses.md#5
module:
  tvl:
    module: conformance.runtime
  tvl_version: '1.3'
  environment:
    snapshot_id: '2026-10-16T00:00:00Z'
  evaluation_set:
    dataset: test://runtime
  tvars:
  - name: model_choice
    type: enum[str]
    domain:
    - small
    - large
  objectives:
  - name: quality
    direction: maximize
  promotion_policy:
    dominance: epsilon_pareto
    alpha: 0.05
    min_effect:
      quality: 0.02
  requirements:
  - name: cycle_req
    kind: recovery_time
    unit: episode
    of: cycle_monitor
    within_hours: 24
  monitors:
  - name: cycle_monitor
    requirement: cycle_req
    phase: runtime
    evidence:
      source: episodes
    decision:
      method: exact_count_v1
input:
  kind: lint
  operation: validate
expected:
  diagnostics:
  - code: runtime_dependency_cycle
    severity: error
