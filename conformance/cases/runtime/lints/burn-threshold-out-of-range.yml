case_format: tvl-runtime-case/1
family: lints
description: burn threshold out of range
spec_refs:
- formalization/tvl-formal-semantics.md#12.1
- formalization/tvl-formal-semantics.md#12.12
- formalization/tvl-formal-semantics.md#B.4
module:
  tvl:
    module: conformance.runtime
  tvl_version: '1.3'
  environment:
    snapshot_id: '2026-10-16T00:00:00Z'
  evaluation_set:
    dataset: test://runtime
  tvars:
  - name: model_choice
    type: enum[str]
    domain:
    - small
    - large
  objectives:
  - name: quality
    direction: maximize
  promotion_policy:
    dominance: epsilon_pareto
    alpha: 0.05
    min_effect:
      quality: 0.02
  requirements:
  - name: requirement_main
    kind: rate_bound
    unit: invocation
    violation:
      metric: wall_clock_latency_ms
      exceeds: 2000
    max_rate: 0.05
  monitors:
  - name: monitor_main
    requirement: requirement_main
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: production
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
      sampling:
        mode: head_sampled_declared
        rate: 0.5
    decision:
      method: clopper_pearson_rational_v2
      false_alarm_budget: 0.05
      min_samples: 200
      max_unresolved_fraction: 0.05
      horizon_days: 30
      model: iid_bernoulli_within_window_v1
      threshold_factor: 20
    applies_to: agent
    window:
      tumbling_hours: 6
      grace_minutes: 30
input:
  kind: lint
  operation: validate
expected:
  diagnostics:
  - code: runtime_burn_out_of_range
    severity: error
