case_format: tvl-runtime-case/1
family: lints
description: among must be a checker predicate (exact pattern rejected)
spec_refs:
- formalization/tvl-formal-semantics.md#12.1
- formalization/tvl-formal-semantics.md#12.12
- formalization/tvl-formal-semantics.md#B.4
module:
  tvl:
    module: conformance.runtime
  tvl_version: '1.3'
  environment:
    snapshot_id: '2026-10-16T00:00:00Z'
  evaluation_set:
    dataset: test://runtime
  tvars:
  - name: model_choice
    type: enum[str]
    domain:
    - small
    - large
  objectives:
  - name: quality
    direction: maximize
  promotion_policy:
    dominance: epsilon_pareto
    alpha: 0.05
    min_effect:
      quality: 0.02
  requirements:
  - name: requirement_main
    kind: zero_tolerance
    unit: invocation
    among:
      pattern: absence
      a:
        event: error
    violation:
      pattern: absence
      a:
        event: tool_call
        tool: payments.refund
  monitors:
  - name: monitor_main
    requirement: requirement_main
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: production
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
    decision:
      method: exact_count_v1
    applies_to: agent
    window:
      tumbling_hours: 6
      grace_minutes: 30
    episode:
      closure_windows: 2
      closure_max_age_hours: 24
input:
  kind: lint
  operation: validate
expected:
  diagnostics:
  - code: runtime_among_not_checker
    severity: error
