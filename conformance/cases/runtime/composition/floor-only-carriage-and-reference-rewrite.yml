case_format: tvl-runtime-case/1
family: composition
description: Matched primary aliases are rewritten before floor-only obligation carriage.
spec_refs:
- formalization/rfc-0003-runtime-requirements-monitors-responses.md#9.4
input:
  kind: compose
  operation: overlay
expected:
  composed_fields:
    /monitors/0/name: agent_monitor
    /monitors/0/applies_to: agent
    /monitors/1/name: floor_live_monitor
    /monitors/1/applies_to: tenant_floor
    /requirements/1/of: agent_monitor
    /responses/0/rules/0/trigger/monitor: agent_monitor
  floor_matches:
  - merged
  - floor_only
base:
  tvl_version: '1.3'
  requirements:
  - name: floor_req
    kind: rate_bound
    unit: invocation
    violation:
      metric: wall_clock_latency_ms
      exceeds: 2000
    max_rate: 0.05
  - name: floor_live
    kind: evidence_liveness
    unit: window
    of: floor_monitor
    max_stale_windows: 1
  monitors:
  - name: floor_monitor
    requirement: floor_req
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: production
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
      sampling:
        mode: head_sampled_declared
        rate: 0.5
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      min_samples: 200
      max_unresolved_fraction: 0.05
      horizon_days: 30
      model: iid_bernoulli_within_window_v1
    applies_to: tenant_floor
    window:
      tumbling_hours: 6
      grace_minutes: 30
    episode:
      closure_windows: 2
      closure_max_age_hours: 24
  - name: floor_live_monitor
    requirement: floor_live
    phase: runtime
    applies_to: tenant_floor
    evidence:
      source: windows
    decision:
      method: exact_count_v1
  pack:
    module: test_pack
  responses:
  - name: pack_alerts
    rules:
    - id: alert
      trigger:
        monitor: floor_monitor
        event: episode_opened
      do: notify
      severity: warning
overlay:
  tvl:
    module: conformance.runtime
  tvl_version: '1.3'
  environment:
    snapshot_id: '2026-10-16T00:00:00Z'
  evaluation_set:
    dataset: test://runtime
  tvars:
  - name: model_choice
    type: enum[str]
    domain:
    - small
    - large
  objectives:
  - name: quality
    direction: maximize
  promotion_policy:
    dominance: epsilon_pareto
    alpha: 0.05
    min_effect:
      quality: 0.02
  requirements:
  - name: agent_req
    kind: rate_bound
    unit: invocation
    violation:
      metric: wall_clock_latency_ms
      exceeds: 2000
    max_rate: 0.05
  monitors:
  - name: agent_monitor
    requirement: agent_req
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: production
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
      sampling:
        mode: head_sampled_declared
        rate: 0.5
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      min_samples: 200
      max_unresolved_fraction: 0.05
      horizon_days: 30
      model: iid_bernoulli_within_window_v1
    applies_to: agent
    window:
      tumbling_hours: 6
      grace_minutes: 30
    episode:
      closure_windows: 2
      closure_max_age_hours: 24
