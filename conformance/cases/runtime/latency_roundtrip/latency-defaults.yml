case_format: tvl-runtime-case/1
family: latency_roundtrip
description: Both directions preserve the 13-field backend create profile; decimal fields compare as exact decimal
  values, not text formatting.
spec_refs:
- formalization/tvl-formal-semantics.md#12.1
- formalization/tvl-formal-semantics.md#12.6
module:
  tvl:
    module: conformance.runtime
  tvl_version: '1.3'
  environment:
    snapshot_id: '2026-10-16T00:00:00Z'
  evaluation_set:
    dataset: test://runtime
  tvars:
  - name: model_choice
    type: enum[str]
    domain:
    - small
    - large
  objectives:
  - name: quality
    direction: maximize
  promotion_policy:
    dominance: epsilon_pareto
    alpha: 0.05
    min_effect:
      quality: 0.02
  requirements:
  - name: requirement_main
    kind: rate_bound
    unit: trace
    violation:
      metric: wall_clock_latency_ms
      exceeds: 2000
    max_rate: 0.05
  monitors:
  - name: monitor_main
    requirement: requirement_main
    phase: runtime
    evidence:
      source: backend_trace_metadata
      deployment_environment: production
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
      sampling: unverified
    decision:
      method: clopper_pearson_exact_v1
      confidence: 0.95
      false_alarm_budget: 0.05
      min_samples: 200
      max_unresolved_fraction: 0.05
      horizon_days: 30
      model: iid_bernoulli_within_window_v1
    profile: backend_v1
    applies_to: agent
    window:
      tumbling_hours: 6
      grace_minutes: 30
    episode:
      closure_windows: 2
      closure_max_age_hours: 24
input:
  kind: roundtrip
  monitor: monitor_main
  operation: backend_profile
  backend_profile:
    kind: latency_violation_rate
    latency_threshold_ms: 2000
    environment: production
    max_violation_rate: '0.05'
    confidence: '0.95'
    window_hours: 6
    grace_minutes: 30
    min_samples: 200
    max_unresolved_fraction: '0.05'
    closure_windows: 2
    closure_max_age_hours: 24
    false_alarm_budget: '0.05'
    horizon_days: 30
expected:
  backend_profile:
    kind: latency_violation_rate
    latency_threshold_ms: 2000
    environment: production
    max_violation_rate: '0.05'
    confidence: '0.95'
    window_hours: 6
    grace_minutes: 30
    min_samples: 200
    max_unresolved_fraction: '0.05'
    closure_windows: 2
    closure_max_age_hours: 24
    false_alarm_budget: '0.05'
    horizon_days: 30
  roundtrip_preserved: true
  evaluation_metadata:
    method: clopper_pearson_exact_v1
    model: iid_bernoulli_within_window_v1
    sampling: unverified
