case_format: tvl-runtime-case/1
family: conditions
description: 'RFC 0011 2.4 item 4: snapshot 2026-11-20T00:00:00-05:00 is 05:00Z; an anchor of 2027-11-20T05:00:01Z
  is one second beyond one year after it.'
spec_refs:
- formalization/rfc-0011-tuning-conditions.md#2.4
- formalization/rfc-0011-tuning-conditions.md#2.1
module:
  tvl_version: '1.7'
  tvl:
    module: slice.doc_classifier
  environment:
    snapshot_id: '2026-11-20T00:00:00-05:00'
  evaluation_set:
    dataset: test://slice
  tvars:
  - name: model
    type: enum[str]
    domain:
    - anthropic/claude-haiku-4-5
    - anthropic/claude-sonnet-4-6
  objectives:
  - name: quality
    direction: maximize
  promotion_policy:
    dominance: epsilon_pareto
    alpha: 0.05
    min_effect:
      quality: 0.02
  requirements:
  - name: quality_floor
    kind: rate_bound
    unit: invocation
    violation:
      checker: customer:doc_label_check
      label_in:
      - fail
    max_rate: 0.08
  monitors:
  - name: quality_prod
    requirement: quality_floor
    phase: runtime
    evidence:
      source: customer_side
      deployment_environment: production
      attribution: agent_key_exact_v1
      resolution: terminal_status_v1
      sampling:
        mode: hash_bernoulli_committed_v1
        rate: 0.02
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
      min_samples: 200
      max_unresolved_fraction: 0.05
      horizon_days: 30
      model: iid_bernoulli_within_window_v1
    window:
      tumbling_hours: 24
      grace_minutes: 0
    episode:
      closure_windows: 2
      closure_max_age_hours: 168
      closure_scope: since_head_move
  - name: quality_gate
    requirement: quality_floor
    phase: promotion
    evidence:
      source: evaluation_set
    decision:
      method: clopper_pearson_rational_v2
      confidence: 0.95
      false_alarm_budget: 0.05
  responses:
  - name: tuning
    rules:
    - id: on_new_model
      trigger:
        schedule:
          every_days: 7
          anchor: '2027-11-20T05:00:01Z'
      do: optimize
      approval: human
      deploy: if_promoted
      protects:
      - quality_floor
    - id: on_breach
      trigger:
        monitor: quality_prod
        event: episode_opened
      do: optimize
      approval: human
      deploy: if_promoted
input:
  kind: lint
expected:
  diagnostics:
  - code: schedule_anchor_out_of_range
    severity: error
