name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Python test suite
        run: pytest -q tests

  vscode:
    name: VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install CLI tools into repository virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
          test -x .venv/bin/tvl-validate
          test -x .venv/bin/tvl-lint

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install extension dependencies
        working-directory: vscode-tvl
        run: npm ci --ignore-scripts

      - name: Compile and test extension
        working-directory: vscode-tvl
        env:
          TVL_REQUIRE_CLI: "1"
        run: npm test

  website:
    name: Website Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: "10"

      - name: Install website sync dependency
        run: python -m pip install "PyYAML>=6"

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Run website test suite
        working-directory: website
        run: pnpm run test

      - name: Build website
        working-directory: website
        run: pnpm run build

      - name: Install Playwright Chromium
        working-directory: website
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Build book PDF
        working-directory: website
        env:
          BOOK_PILOT: "0"
        run: pnpm book:pdf

      - name: Check book PDF
        working-directory: website
        run: pnpm book:check
