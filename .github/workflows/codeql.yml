name: CodeQL

# Restores CodeQL code scanning on this repository.
#
# Scanning previously ran via GitHub "default setup" and went dark when an
# organization-level code-security configuration disabled it. No workflow
# existed to take over, so the repository reported "0 open alerts" — a false
# clean, not a clean. CodeQL is free on public repositories, so this costs
# nothing to run.
#
# This workflow is deliberately GUARD-FREE. There is no availability probe, no
# `continue-on-error`, and no conditional skip around init/analyze. A future
# security-configuration change therefore cannot silently disable scanning
# again; it can only make this job fail loudly. A scan job must fail closed and
# must never report success without having scanned.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  # github.event_name is part of the key so a push never cancels the weekly
  # scheduled comprehensive scan (both run against refs/heads/main).
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # python/  tvl_tools/  tests/  conformance/
          - language: python
            build-mode: none
          # website/  vscode-tvl/  editor_shared/
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Include default and extended security queries plus maintainability
          # and reliability checks on every configured event.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
