name: Deploy TVL Website

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tvl-website-deploy.yml"
      - "website/**"
      - "spec/**"
      - "docs/**"
      - "formalization/**"
      - "book/**"
      - "tvl_book/**"
      - "python/**"
      - "tvl_tools/**"
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Git ref to deploy"
        required: false
        default: "main"

concurrency:
  group: deploy-tvl-website
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}
      TVL_WEBSITE_S3_BUCKET: ${{ vars.TVL_WEBSITE_S3_BUCKET }}
      TVL_WEBSITE_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.TVL_WEBSITE_CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.deploy_ref || github.ref }}
          persist-credentials: false

      - name: Validate deployment settings
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          test -n "$AWS_ROLE_TO_ASSUME"
          test -n "$AWS_REGION"
          test -n "$TVL_WEBSITE_S3_BUCKET"
          test -n "$TVL_WEBSITE_CLOUDFRONT_DISTRIBUTION_ID"

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.30.3

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install website sync dependency
        run: python -m pip install "PyYAML>=6"

      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build TVL website
        working-directory: website
        run: pnpm run build

      - name: Install Playwright Chromium
        working-directory: website
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Build book PDF
        working-directory: website
        env:
          BOOK_PILOT: "0"
        run: pnpm book:pdf

      - name: Check book PDF
        working-directory: website
        run: pnpm book:check

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy fingerprinted assets
        run: |
          aws s3 sync \
            website/dist/public/assets/ \
            "s3://${TVL_WEBSITE_S3_BUCKET}/assets/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy site files
        run: |
          aws s3 sync \
            website/dist/public/ \
            "s3://${TVL_WEBSITE_S3_BUCKET}/" \
            --delete \
            --exclude "assets/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$TVL_WEBSITE_CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
