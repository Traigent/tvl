name: Lean Proofs

on:
  push:
    branches:
      - main
    paths:
      - "proofs/**"
      - "spec/grammar/**"
      - "formalization/**"
      - ".github/workflows/lean-proofs.yml"
  pull_request:
    paths:
      - "proofs/**"
      - "spec/grammar/**"
      - "formalization/**"
      - ".github/workflows/lean-proofs.yml"

permissions:
  contents: read

# A newer push to the same pull request cancels the superseded run. Every run that
# is not a pull_request run (here the push to main; the expression below also covers
# merge_group, schedule and workflow_dispatch, which this file does not declare)
# gets a group of its own, keyed by run id: a shared group holds one pending run,
# and GitHub cancels it when a newer one queues, even with cancel-in-progress false.
# Re-runs keep their run id, so a re-run stays in its original run's group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lake-build:
    name: Lean Build (proofs/)
    runs-on: ubuntu-latest
    # Observed: about 3 min median with a warm cache, 22 min max on a cold
    # Mathlib cache; the limit leaves room for a cold build.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reject sorry, admit and axiom declarations
        run: |
          if grep -rnE --include='*.lean' --exclude-dir=.lake '\bsorry\b|\badmit\b|^[[:space:]]*axiom\b' proofs; then
            echo "::error::Lean sources must not contain sorry, admit or axiom declarations"
            exit 1
          fi

      # Re-verifies proofs/PROOF_SUMMARY.md's "Build completed successfully"
      # claim on every change instead of leaving it a point-in-time claim.
      # lean-action installs elan, fetches the Mathlib oleans cache, and runs
      # `lake build`; it also caches proofs/.lake via actions/cache so repeat
      # builds of an unchanged manifest are fast.
      - name: Build Lean proofs
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: proofs
          build: "true"
          test: "false"
          lint: "false"
